version: 1
id: flow.activity_online

steps:
  - id: admin_create_activity
    run: node
    whenUnset: [activityAlias]
    args:
      - skills/weex-admin-ops/scripts/lottery-activity-fast-api.mjs
      - --action
      - create-draft
      - --title-prefix
      - 前端主回归
      - --alias-prefix
      - lf
      - --start-offset-seconds
      - "30"
    capture:
      activityAlias: alias

  - id: admin_online_activity
    run: node
    whenSet: [activityAlias]
    whenUnset: [activityOnline]
    args:
      - skills/weex-admin-ops/scripts/lottery-activity-fast-api.mjs
      - --action
      - online
      - --activity-alias
      - "{{activityAlias}}"
    assert:
      - path: ok
        equals: true
    capture:
      activityOnline: ok
