version: 1
id: flow.frontend_recharge

steps:
  - id: frontend_recharge_prepare
    run: node
    whenSet: [activityAlias]
    args:
      - skills/weex-frontend-ops/scripts/lottery-frontend-main-flow.mjs
      - --phase
      - recharge
      - --activity-alias
      - "{{activityAlias}}"
      - --recharge-amount
      - "{{rechargeAmount}}"
    capture:
      mqSent: mqRecharge.sent
      mqOk: mqRecharge.ok
      mqCountBefore: mqRecharge.countBefore
      mqCountAfter: mqRecharge.countAfter
    assert:
      - path: ok
        equals: true

